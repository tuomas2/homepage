<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asunto vuokrattu - Ahde 1 B</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .status-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 700;
        }

        .address {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 30px;
        }

        .message {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .date {
            font-size: 0.95rem;
            color: #999;
            font-style: italic;
        }

        .archive-link {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .archive-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .archive-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2rem;
            }

            .status-icon {
                font-size: 60px;
            }

            .address {
                font-size: 1.1rem;
            }

            .message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-icon">✓</div>
        <h1>Asunto on vuokrattu</h1>
        <div class="message">
            <p>Tämä vuokra-ilmoitus ei ole enää voimassa.</p>
            <p style="margin-top: 15px;">Vuokralainen on löytynyt.</p>
        </div>
    </div>
</body>
</html>
